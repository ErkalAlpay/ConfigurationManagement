services:
  configuration-api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Redis: "redis:6379"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
